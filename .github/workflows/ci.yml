name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    name: Shared code and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:allTests :server:test :tools:convoy-sim:test

  web:
    name: Web convoy page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No dependencies: Node's own test runner, against vectors from the app's code.
      - run: npm test
        working-directory: web

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The runner image ships an Android SDK (ANDROID_HOME); missing platforms download on demand.
      - run: ./gradlew :android:app:assembleFossDebug :android:app:assemblePlayDebug :android:app:testFossDebugUnitTest :android:app:lintFossDebug
      - name: Name the dev APKs
        run: |
          mkdir apks
          cp android/app/build/outputs/apk/foss/debug/app-foss-debug.apk apks/foxnav-dev-foss.apk
          cp android/app/build/outputs/apk/play/debug/app-play-debug.apk apks/foxnav-dev-play.apk
      # One artifact per APK, not zipped: each downloads straight from the run's page as the APK itself.
      # (Unzipped artifacts are single files, named after the file.)
      - uses: actions/upload-artifact@v7
        with:
          path: apks/foxnav-dev-foss.apk
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: apks/foxnav-dev-play.apk
          archive: false
          retention-days: 14

  dev-release:
    name: Dev release
    # The latest build from main, as a pre-release with direct download links for phones.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: foxnav-dev-*.apk
          path: apks
          merge-multiple: true
      - name: Replace the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wherever the download put them: both APKs, or no release.
          mapfile -t apks < <(find apks -name '*.apk' | sort)
          [ "${#apks[@]}" -eq 2 ] || { echo "Expected 2 APKs, found: ${apks[*]}"; exit 1; }
          gh release delete dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create dev "${apks[@]}" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build" \
            --notes "Debug build of ${GITHUB_SHA::7} (CI run $GITHUB_RUN_NUMBER), replaced by every push to main.

          - \`foxnav-dev-play.apk\` for phones with Google Play services, \`foxnav-dev-foss.apk\` for phones without.
          - Dev builds are a separate app (FoxNav Dev, \`app.nullpointr.foxnav.dev\`), next to any store install, and each installs over the previous one."

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file server/Dockerfile --tag foxnav-server:ci .
