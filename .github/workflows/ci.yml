name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    name: Shared code and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:allTests :server:test :tools:convoy-sim:test

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The runner image ships an Android SDK (ANDROID_HOME); missing platforms download on demand.
      - run: ./gradlew :android:app:assembleFossDebug :android:app:assemblePlayDebug :android:app:lintFossDebug

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file server/Dockerfile --tag foxnav-server:ci .
