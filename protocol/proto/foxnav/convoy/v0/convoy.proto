// FoxNav realtime protocol, v0 draft. See protocol/SPEC.md §2.
// Draft: field numbers and messages will change before v1.
syntax = "proto3";

package foxnav.convoy.v0;

option java_package = "app.nullpointr.foxnav.protocol.convoy.v0";

// ---------------------------------------------------------------------------
// Envelope: what the server sees. Frames (§2.3) are signed and end-to-end
// encrypted; the server reads only their 13-byte header.
// Member IDs are the first 4 bytes of the SHA-256 of the member's signing key.
// ---------------------------------------------------------------------------

message ClientMessage {
  oneof message {
    Hello hello = 1;
    CreateConvoy create_convoy = 2;
    JoinConvoy join_convoy = 3;
    Resume resume = 4;
    Publish publish = 5;
    LeaveConvoy leave_convoy = 6;
    RemoveMember remove_member = 7;
    Ping ping = 8;
    HandOver hand_over = 9;
  }
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    ConvoyCreated convoy_created = 2;
    Joined joined = 3;
    Relay relay = 4;
    MemberJoined member_joined = 5;
    MemberLeft member_left = 6;
    Pong pong = 7;
    Error error = 8;
    InviteChanged invite_changed = 9;
  }
}

// First message on a new connection.
message Hello {
  string client = 1; // e.g. "FoxNav Android 0.1.0"
}

message Welcome {
  string server = 1;           // e.g. "foxnav-server 0.1.0"
  uint32 max_convoy_size = 2;  // members per convoy
}

// Creates a convoy and joins the creator, who becomes its owner. The server answers
// ConvoyCreated, then Joined.
message CreateConvoy {
  fixed32 member_id = 1;
  bytes owner_key = 2; // the creator's Ed25519 public key; member_id must be its ID
}

message ConvoyCreated {
  bytes convoy_id = 1;  // 16 random bytes
  bytes join_token = 2; // shared through the invite link
}

message JoinConvoy {
  bytes convoy_id = 1;
  bytes join_token = 2;
  fixed32 member_id = 3; // the joiner's own; refused with CONFLICT if already in the convoy
}

// Rejoins after a dropped connection without a new join.
message Resume {
  bytes resume_token = 1;
}

message Joined {
  bytes convoy_id = 1;
  fixed32 member_id = 2;
  bytes resume_token = 3;
  repeated fixed32 members = 4; // everyone else connected to the server
  reserved 5;
  bytes join_token = 6;          // the current one: it changes when someone is removed
  repeated Relay frames = 7;     // the frames the server keeps, oldest first
}

message MemberJoined {
  fixed32 member_id = 1;
}

message MemberLeft {
  fixed32 member_id = 1;
  bool removed = 2; // removed by the owner rather than leaving
}

// The join token changed because someone was removed: invites with the old one stop working.
message InviteChanged {
  bytes join_token = 1;
}

message Publish {
  bytes frame = 1;
}

message Relay {
  bytes frame = 1;
  fixed32 from = 2;          // who published it: the sender, or a gateway forwarding it from a radio
  int64 server_time_ms = 3;  // Unix epoch milliseconds when the server relayed it
  uint64 age_ms = 4;         // in Joined.frames: how long ago the server received it
}

message LeaveConvoy {}

// Only the convoy's owner may remove members. signature: Ed25519 by the owner's key over
// "foxnav v0 remove" ‖ convoy_id ‖ member_id (4 bytes) ‖ epoch (4 bytes).
message RemoveMember {
  fixed32 member_id = 1;
  uint32 epoch = 2; // the key epoch the owner's rotation starts
  bytes signature = 3;
}

// The owner hands the convoy over. signature: Ed25519 by the owner's key over
// "foxnav v0 handover" ‖ convoy_id ‖ number (4 bytes) ‖ new_owner_key.
message HandOver {
  uint32 number = 1; // 1 for the convoy's first handover
  bytes new_owner_key = 2;
  bytes signature = 3;
}

message Ping {}

message Pong {}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_BAD_REQUEST = 1;
    CODE_NOT_FOUND = 2;      // unknown convoy or expired resume token
    CODE_FORBIDDEN = 3;      // wrong join token, or a missing or wrong owner's signature
    CODE_CONVOY_FULL = 4;
    CODE_RATE_LIMITED = 5;
    CODE_CONFLICT = 6;       // the member ID is already in the convoy
  }
  Code code = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Frame contents: what members see after decrypting a frame, one message per
// frame kind (§2.3), at most 140 bytes.
// ---------------------------------------------------------------------------

// CARD: who a member is. Its signing key's member ID is the frame's sender.
message Card {
  bytes signing_key = 1;  // Ed25519 public key, 32 bytes
  bytes exchange_key = 2; // X25519 public key, 32 bytes, for receiving new convoy keys
  Profile profile = 3;
}

// POSITION
message Position {
  sfixed32 lat_e7 = 1;     // degrees × 10^7
  sfixed32 lon_e7 = 2;     // degrees × 10^7
  uint32 speed_cms = 3;    // shown to other members; needed for motion prediction
  uint32 heading_deg = 4;  // 0-359, clockwise from north
  uint32 accuracy_m = 5;   // horizontal, 68% confidence
  int64 fix_time_ms = 6;   // Unix epoch milliseconds of the GPS fix
}

message Profile {
  // A part in the convoy that a member takes on themselves; anyone may, and more than one may.
  enum Role {
    ROLE_UNSPECIFIED = 0; // just driving along
    ROLE_LEAD = 1;        // leads the way: the others follow
    ROLE_TAIL = 2;        // sweeps up at the back: nobody gets left behind
  }
  string display_name = 1;
  Car car = 2;
  bool watching = 3; // follows the convoy (say, from a browser) without sharing a position
  Role role = 4;
}

// SONG: what the member's car stereo is playing, for the others to play along in their own
// music app. An empty one ends the share.
message NowPlaying {
  string title = 1;
  string artist = 2;
  string app = 3; // the music app's name, like "Spotify"
}

message Car {
  enum BodyStyle {
    BODY_STYLE_UNSPECIFIED = 0;
    BODY_STYLE_COUPE = 1;
    BODY_STYLE_HATCHBACK = 2;
    BODY_STYLE_SEDAN = 3;
    BODY_STYLE_WAGON = 4;
    BODY_STYLE_CONVERTIBLE = 5;
    BODY_STYLE_KEI = 6;
    BODY_STYLE_SUV = 7;
    BODY_STYLE_VAN = 8;
    BODY_STYLE_PICKUP = 9;
  }
  string make = 1;
  string model = 2;
  uint32 color_rgb = 3; // 0xRRGGBB, the member's colour on the map
  BodyStyle body_style = 4;
}

message Waypoint {
  sfixed32 lat_e7 = 1;
  sfixed32 lon_e7 = 2;
  string name = 3;
}

// ROUTE: the shared destination is the last waypoint. Each member routes through them itself.
// An empty one ends the share.
message RouteShare {
  repeated Waypoint waypoints = 1;
}

// EVENT
message Event {
  int64 sent_ms = 1; // Unix epoch milliseconds; receivers drop events more than 5 minutes old
  oneof event {
    QuickMessage quick_message = 2;
    RegroupPin regroup_pin = 3;
  }
}

message QuickMessage {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_FUEL = 1;
    KIND_BREAK = 2;
    KIND_PULL_OVER = 3;
    KIND_POLICE_AHEAD = 4;
    KIND_HAZARD_AHEAD = 5;
    KIND_SLOW_DOWN = 6;
    KIND_ALL_GOOD = 7;
  }
  Kind kind = 1;
}

message RegroupPin {
  Waypoint location = 1;
}

// OWNER: statements only the owner makes, signed with their key.
message OwnerStatement {
  oneof statement {
    KeyRotation key_rotation = 1;
    Handover handover = 2;
  }
}

// A new convoy key, wrapped for each remaining member separately (never under the old key).
// A big convoy's rotation takes several frames: `part` of `parts`, each with some of the keys.
message KeyRotation {
  uint32 epoch = 1;
  repeated fixed32 removed = 2;
  uint32 part = 3;  // from 1
  uint32 parts = 4;
  repeated WrappedKey keys = 5;
}

message WrappedKey {
  fixed32 member_id = 1;
  bytes key = 2; // AES-KW, 40 bytes
}

// The owner hands the convoy over; members accept only the next number.
message Handover {
  uint32 number = 1;
  bytes new_owner_key = 2;
}
