# Local FoxNav map stack. Everything sits behind one origin, http://localhost:8080:
#   /.well-known/foxnav, /styles/*   FoxNav server (discovery document, map styles)
#   /v1/ws, /v1/reports              FoxNav server (convoys, reports)
#   /valhalla/*                      Valhalla (routing)
#   /photon/*                        Photon (search)
#   /tiles/region/{z}/{x}/{y}.mvt    map tiles, from the PMTiles archive (tiles service)
#   /tiles/*.pmtiles, /assets/*      static files (the archive itself, fonts, sprites)
#   /datapacks/*                     static files (speed cameras, winter limits; built by the datapacks service)
#
# Fetch the data first with infra/scripts/fetch-data.sh, then: docker compose up -d
# The first start builds the routing graph and search index; see infra/README.md.
name: foxnav

x-host-user: &host-user
  # Run as your user so everything written to infra/data/ stays yours.
  user: "${FOXNAV_UID:-1000}:${FOXNAV_GID:-1000}"

services:
  gateway:
    image: caddy:2.11
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/tiles:/srv/tiles:ro
      - ./data/assets:/srv/assets:ro
      - ./data/datapacks:/srv/datapacks:ro
    depends_on: [server, tiles, valhalla, photon]
    restart: unless-stopped

  # Serves the PMTiles archive as {z}/{x}/{y} tiles.
  tiles:
    image: protomaps/go-pmtiles:v1.31.2
    command: ["serve", "/tiles", "--port=8080", "--cors=*"]
    volumes:
      - ./data/tiles:/tiles:ro
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      FOXNAV_NAME: FoxNav (local)
      FOXNAV_REGIONS: FI
      FOXNAV_STYLES_DIR: /srv/styles
      FOXNAV_DATAPACKS_URL: /datapacks
      # Drivers' reports survive restarts; Fintraffic's traffic messages seed them (Finland).
      FOXNAV_REPORTS_FILE: /var/lib/foxnav/reports.json
      FOXNAV_FINTRAFFIC: "true"
    volumes:
      - ./styles:/srv/styles:ro
      - reports:/var/lib/foxnav
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    <<: *host-user
    environment:
      server_threads: "4"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
    volumes:
      # Builds the routing graph from the .pbf files here on first start.
      - ./data/valhalla:/custom_files
    restart: unless-stopped

  photon:
    build: ./photon
    <<: *host-user
    environment:
      PHOTON_LANGUAGES: fi,sv,en
      JAVA_TOOL_OPTIONS: -Xmx2g
    volumes:
      # Imports data/photon/import.jsonl.zst into data/photon/photon_data on first start.
      - ./data/photon:/photon
    restart: unless-stopped

  # Builds the data packs from the OpenStreetMap extract. Not a long-running service: run it after
  # fetching new data (fetch-data.sh does), e.g. nightly on a public server:
  #   docker compose -f infra/compose.yaml run --rm datapacks
  # Where OpenStreetMap and Digiroad (Finland) both have a speed limit and disagree, osm or
  # digiroad wins: FOXNAV_SPEED_LIMITS_PREFER=digiroad docker compose … run --rm datapacks
  datapacks:
    build: ./datapacks
    <<: *host-user
    profiles: [tools]
    volumes:
      - ./data/valhalla:/osm:ro
      - ./data/digiroad:/digiroad:ro
      - ./data/datapacks:/out
    command: ["--region", "${FOXNAV_REGION_CODE:-FI}", "--digiroad", "/digiroad", "--prefer", "${FOXNAV_SPEED_LIMITS_PREFER:-osm}", "/osm/${FOXNAV_REGION:-finland}-latest.osm.pbf", "/out"]

volumes:
  reports:
