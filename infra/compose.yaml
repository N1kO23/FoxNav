# Local FoxNav map stack. Everything sits behind one origin, http://localhost:8080, and over HTTPS at
# https://<FOXNAV_LAN_HOST>:8443 for other devices on your network (see infra/README.md):
#   /.well-known/foxnav, /styles/*   FoxNav server (discovery document, map styles)
#   /v1/ws, /v1/reports              FoxNav server (convoys, reports)
#   /valhalla/*                      Valhalla (routing)
#   /photon/*                        Photon (search)
#   /tiles/region/{z}/{x}/{y}.mvt    map tiles, from the PMTiles archive (tiles service)
#   /tiles/*.pmtiles, /assets/*      static files (the archive itself, fonts, sprites)
#   /datapacks/*                     static files (speed cameras, winter limits; built by the datapacks service;
#                                    search packs for searching offline; search-pack service)
#   /routing-tiles/*                 static files (the routing graph's tiles, for routing on the phone; routing-tiles service)
#
# Fetch the data first with infra/scripts/fetch-data.sh, then: docker compose up -d
# The first start builds the routing graph and search index; see infra/README.md.
name: foxnav

x-host-user:
  &host-user # Run as your user so everything written to infra/data/ stays yours.
  user: "${FOXNAV_UID:-1000}:${FOXNAV_GID:-1000}"

services:
  gateway:
    image: caddy:2.11
    ports:
      # Behind a reverse proxy on the same machine, FOXNAV_HTTP_PORT=127.0.0.1:8080 keeps it off the network.
      - "${FOXNAV_HTTP_PORT:-8080}:8080"
      - "8443:8443"
    environment:
      # This machine's name on your network, for the HTTPS site. Set it in infra/.env.
      FOXNAV_LAN_HOST: ${FOXNAV_LAN_HOST:-localhost}
      # A reverse proxy in front, whose forwarded headers count (see the Caddyfile). Set it in infra/.env.
      FOXNAV_TRUSTED_PROXIES: ${FOXNAV_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/tiles:/srv/tiles:ro
      - ./data/assets:/srv/assets:ro
      - ./data/datapacks:/srv/datapacks:ro
      - ./data/routing-tiles:/srv/routing-tiles:ro
      # Caddy's local CA: kept, so devices that trust it keep trusting it.
      - caddy:/data
    depends_on: [server, tiles, valhalla, photon]
    restart: unless-stopped

  # Serves the PMTiles archive as {z}/{x}/{y} tiles. The gateway adds the CORS header: one from
  # each would be two, which browsers refuse, so a convoy page on another origin got no map.
  tiles:
    image: protomaps/go-pmtiles:v1.31.2
    command: ["serve", "/tiles", "--port=8080"]
    volumes:
      - ./data/tiles:/tiles:ro
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # FOXNAV_REGIONS: the regions fetch-data.sh downloaded, e.g. FI,NO,SE.
    env_file:
      - path: ./data/regions.env
        required: false
    environment:
      # What the app and the convoy page call this server, and its privacy policy. Set them in infra/.env.
      FOXNAV_NAME: ${FOXNAV_NAME:-FoxNav (local)}
      FOXNAV_PRIVACY_URL: ${FOXNAV_PRIVACY_URL:-}
      FOXNAV_STYLES_DIR: /srv/styles
      FOXNAV_DATAPACKS_URL: /datapacks
      FOXNAV_ROUTING_TILES_URL: /routing-tiles
      # Drivers' reports survive restarts; Fintraffic's traffic messages seed them (Finland), and
      # Statens vegvesen's (Norway) with an account, set in infra/.env.
      FOXNAV_REPORTS_FILE: /var/lib/foxnav/reports.json
      FOXNAV_FINTRAFFIC: ${FOXNAV_FINTRAFFIC:-true}
      FOXNAV_VEGVESEN_USERNAME: ${FOXNAV_VEGVESEN_USERNAME:-}
      FOXNAV_VEGVESEN_PASSWORD: ${FOXNAV_VEGVESEN_PASSWORD:-}
    volumes:
      - ./styles:/srv/styles:ro
      - reports:/var/lib/foxnav
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    <<: *host-user
    environment:
      server_threads: "4"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      # Build the graph again when the extracts change: a new region, or newer data.
      use_tiles_ignore_pbf: "False"
    volumes:
      # Builds the routing graph from the .pbf file here (fetch-data.sh merges the regions' extracts
      # into one) on first start, and again when it changes.
      - ./data/valhalla:/custom_files
    restart: unless-stopped

  photon:
    build: ./photon
    <<: *host-user
    environment:
      # Names in Finnish, Swedish, Norwegian (Bokmål, Nynorsk), Northern Sami and English.
      PHOTON_LANGUAGES: fi,sv,nb,nn,se,en
      JAVA_TOOL_OPTIONS: -Xmx3g
    volumes:
      # Imports every data/photon/<region>.jsonl.zst into data/photon/photon_data on first start,
      # and again when the dumps change.
      - ./data/photon:/photon
    restart: unless-stopped

  # Builds a region's data packs from its OpenStreetMap extract and national database. Not a
  # long-running service: run it after fetching new data (fetch-data.sh does, for each region), e.g.
  #   docker compose -f infra/compose.yaml run --rm datapacks                     (Finland)
  #   docker compose -f infra/compose.yaml run --rm datapacks --region NO --nvdb /nvdb /osm/norway-latest.osm.pbf /out
  # Where OpenStreetMap and the official limits (Digiroad in Finland, NVDB in Norway) both have a
  # speed limit and disagree, the official one wins, winter limits included. For OpenStreetMap's
  # instead: FOXNAV_SPEED_LIMITS_PREFER=osm docker compose ... run --rm datapacks
  datapacks:
    build: ./datapacks
    <<: *host-user
    profiles: [tools]
    volumes:
      - ./data/osm:/osm:ro
      - ./data/digiroad:/digiroad:ro
      - ./data/nvdb:/nvdb:ro
      - ./data/datapacks:/out
    command:
      [
        "--region",
        "${FOXNAV_REGION_CODE:-FI}",
        "--digiroad",
        "/digiroad",
        "--nvdb",
        "/nvdb",
        "--prefer",
        "${FOXNAV_SPEED_LIMITS_PREFER:-official}",
        "/osm/${FOXNAV_REGION:-finland}-latest.osm.pbf",
        "/out",
      ]

  # Merges the regions' OpenStreetMap extracts into one for Valhalla, which can't take extracts that
  # overlap at their borders. fetch-data.sh runs it whenever the extracts change.
  osm-merge:
    build: ./datapacks
    <<: *host-user
    profiles: [tools]
    entrypoint: ["osmium", "merge", "--overwrite"]
    volumes:
      - ./data/osm:/osm:ro
      - ./data/valhalla:/valhalla

  # Publishes Valhalla's graph as tiles for routing on the phone without a connection (protocol/SPEC.md
  # §3.3). Not a long-running service either: run it whenever Valhalla has built a new graph, e.g.
  #   docker compose -f infra/compose.yaml run --rm routing-tiles
  # Publishing the same graph again changes nothing; a new one keeps the previous build next to it.
  routing-tiles:
    build: ./datapacks
    <<: *host-user
    profiles: [tools]
    entrypoint: ["python3", "/opt/datapacks/routing_tiles.py"]
    volumes:
      - ./data/valhalla:/valhalla:ro
      - ./data/routing-tiles:/out
    command: ["/valhalla/valhalla_tiles", "/out"]

  # Builds a region's search pack from its Photon dump, for searching on the phone without a
  # connection (protocol/SPEC.md §3.4). Run it after fetching a new dump (fetch-data.sh does), e.g.
  #   docker compose -f infra/compose.yaml run --rm search-pack                   (Finland)
  #   docker compose -f infra/compose.yaml run --rm search-pack --region NO /photon/norway.jsonl.zst /out
  # Building from the same dump again changes nothing; a new pack keeps the previous build next to it.
  search-pack:
    build: ./datapacks
    <<: *host-user
    profiles: [tools]
    entrypoint: ["python3", "/opt/datapacks/search_pack.py"]
    volumes:
      - ./data/photon:/photon:ro
      - ./data/datapacks:/out
    command:
      [
        "--region",
        "${FOXNAV_REGION_CODE:-FI}",
        "/photon/${FOXNAV_REGION:-finland}.jsonl.zst",
        "/out",
      ]

volumes:
  reports:
  caddy:
